name: Read real Kalshi balance - no trading

on:
  push:
    branches: [account-balance-check-20261029]
    paths: ['.github/workflows/account-balance-check.yml']

permissions: {}

jobs:
  balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install request signing dependency
        run: python -m pip install 'cryptography>=42,<47'

      - name: Read the primary production account balance
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          from datetime import datetime, timezone
          from decimal import Decimal
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ed25519, padding

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          def check_balance():
              key_id = os.environ.get('KALSHI_API_KEY_ID', '').strip()
              raw_key = os.environ.get('KALSHI_PRIVATE_KEY', '')
              if not key_id or not raw_key:
                  return {'ok': False, 'reason': 'Required Kalshi credentials are not available to this job.'}
              try:
                  private_key = serialization.load_pem_private_key(raw_key.encode(), password=None)
                  timestamp = str(int(time.time() * 1000))
                  path = '/trade-api/v2/portfolio/balance'
                  message = (timestamp + 'GET' + path).encode()
                  if isinstance(private_key, ed25519.Ed25519PrivateKey):
                      signature = private_key.sign(message)
                  else:
                      signature = private_key.sign(message, padding.PSS(mgf=padding.MGF1(hashes.SHA256()), salt_length=hashes.SHA256().digest_size), hashes.SHA256())
              except Exception:
                  return {'ok': False, 'reason': 'The configured Kalshi signing credentials could not be loaded or used.'}
              request = Request(
                  'https://external-api.kalshi.com' + path + '?subaccount=0',
                  method='GET',
                  headers={
                      'Accept': 'application/json',
                      'KALSHI-ACCESS-KEY': key_id,
                      'KALSHI-ACCESS-TIMESTAMP': timestamp,
                      'KALSHI-ACCESS-SIGNATURE': base64.b64encode(signature).decode(),
                  },
              )
              try:
                  with build_opener(NoRedirect()).open(request, timeout=15) as response:
                      data = json.loads(response.read(65536), parse_float=Decimal)
              except HTTPError as error:
                  return {'ok': False, 'http_status': error.code, 'reason': 'Kalshi did not authorize or complete the balance read.'}
              except (URLError, TimeoutError, OSError):
                  return {'ok': False, 'reason': 'The balance request could not reach Kalshi within its network limit.'}
              except Exception:
                  return {'ok': False, 'reason': 'Kalshi returned an unreadable balance response.'}
              try:
                  if not isinstance(data, dict):
                      raise ValueError('unexpected response')
                  if isinstance(data.get('balance_dollars'), str):
                      available = Decimal(data['balance_dollars'])
                  elif isinstance(data.get('balance'), int) and not isinstance(data['balance'], bool):
                      available = Decimal(data['balance']) / 100
                  else:
                      raise ValueError('missing balance')
                  portfolio_cents = data['portfolio_value']
                  if not isinstance(portfolio_cents, int) or isinstance(portfolio_cents, bool):
                      raise ValueError('invalid portfolio value')
                  portfolio = Decimal(portfolio_cents) / 100
                  if not available.is_finite() or not portfolio.is_finite():
                      raise ValueError('invalid monetary value')
                  updated_ts = data.get('updated_ts')
                  updated_at = datetime.fromtimestamp(updated_ts, timezone.utc).isoformat() if isinstance(updated_ts, int) and not isinstance(updated_ts, bool) else None
              except Exception:
                  return {'ok': False, 'reason': 'Kalshi returned balance fields that could not be verified.'}
              return {
                  'ok': True,
                  'environment': 'production',
                  'subaccount': 0,
                  'exchange_scope': 'all',
                  'available_balance_usd': format(available, 'f'),
                  'portfolio_value_usd': format(portfolio, 'f'),
                  'balance_updated_at_utc': updated_at,
              }

          result = check_balance()
          result['checked_at_utc'] = datetime.now(timezone.utc).isoformat()
          print('ACCOUNT_BALANCE_RESULT=' + json.dumps(result, sort_keys=True))
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as report:
                  report.write('## Read-only Kalshi account check\n\n')
                  if result['ok']:
                      report.write('Production account, primary subaccount, all exchange indexes.\n\n')
                      report.write('- Available cash: $' + result['available_balance_usd'] + '\n')
                      report.write('- Portfolio value reported by Kalshi: $' + result['portfolio_value_usd'] + '\n')
                  else:
                      report.write('Balance not confirmed: ' + result['reason'] + '\n')
                  report.write('\nChecked at: ' + result['checked_at_utc'] + '\n')
                  report.write('\nThis check only reads the balance. It submits no orders and makes no account changes.\n')
          PY
