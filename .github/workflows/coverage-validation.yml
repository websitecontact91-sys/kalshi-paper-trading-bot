name: Validate paper trading implementation and coverage

on:
  push:
    branches: [main]
    paths-ignore:
      - 'paper_state.json'
      - 'ledger_archive/**'
      - 'paper_sessions/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the event commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record the actual source SHA
        id: provenance
        run: >-
          python3 scripts/workflow_gate.py --provenance-only
          --github-output "$GITHUB_OUTPUT"
          --metadata runtime_reports/workflow_provenance.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run the complete offline suite
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m pytest -q | tee runtime_reports/pytest.txt

      - name: Diagnose missed market settlements (read-only temporary)
        run: |
          python - <<'PY'
          import requests
          tickers = [
              "KXZEC15M-26OCT312015-15",
              "KXETH15M-26OCT312130-30",
              "KXHYPE15M-26OCT312215-15",
              "KXDOGE15M-26OCT312230-30",
              "KXBNB15M-26OCT312245-45",
              "KXXRP15M-26OCT312300-00",
              "KXSOL15M-26NOV010130-30",
              "KXXRP15M-26NOV010145-45",
              "KXETH15M-26NOV010245-45",
              "KXZEC15M-26NOV010400-00",
              "KXSOL15M-26NOV010500-00",
              "KXDOGE15M-26NOV010530-30",
              "KXBTC15M-26NOV010600-00",
          ]
          base = "https://external-api.kalshi.com/trade-api/v2/markets/"
          for ticker in tickers:
              r = requests.get(base + ticker, timeout=10)
              print("DIAG", ticker, r.status_code)
              data = r.json().get("market", r.json()) if r.ok else {}
              print("RESULT", ticker, data.get("status"), data.get("result"),
                    data.get("yes_bid_dollars"), data.get("yes_ask_dollars"))
          PY

      - name: Exercise all six production-runner simulations
        run: |
          set -euo pipefail
          python simulate.py --scenario all | tee runtime_reports/simulation.txt

      - name: Verify the read-only trading boundary
        run: python scripts/audit_paper_boundary.py

      - name: Validate the thirty-series universe against Kalshi
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PAPER_SOURCE_SHA: ${{ steps.provenance.outputs.source_sha }}
          PAPER_CODE_FINGERPRINT: ${{ steps.provenance.outputs.code_fingerprint }}
        run: |
          set -euo pipefail
          python validate_universe.py --output universe_report.csv --json-output universe_report.json --wait 10
          cat universe_report.csv

      - name: Monitor live data for ninety seconds without state writes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PAPER_SOURCE_SHA: ${{ steps.provenance.outputs.source_sha }}
          PAPER_CODE_FINGERPRINT: ${{ steps.provenance.outputs.code_fingerprint }}
        run: >-
          python -u paper_runner.py --duration 90 --interval 2
          --state paper_state.json --report-dir runtime_reports

      - name: Explain intentionally skipped live checks
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: echo 'Offline checks ran. Credentialed live-data verification is restricted to main-branch push/manual runs; this run does not certify live coverage.'

      - name: Preserve source, test, universe and live-monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime_reports/
            universe_report.csv
            universe_report.json
          if-no-files-found: warn
          retention-days: 14
