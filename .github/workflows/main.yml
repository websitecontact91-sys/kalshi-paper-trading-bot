
name: Kalshi Bot - Initial Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download bot code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test trading rules
        run: python -m pytest -q

      - name: Check Kalshi market discovery
        run: python discover.py
