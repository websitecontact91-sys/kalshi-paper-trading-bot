name: Kalshi 15-minute paper trading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

# Keep the running writer alive. New cron/chain events replace a pending run.
concurrency:
  group: kalshi-paper-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Download current code and persistent paper state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate saved state and record the actual checkout
        id: gate
        run: >-
          python3 scripts/workflow_gate.py
          --state paper_state.json
          --github-output "$GITHUB_OUTPUT"
          --metadata runtime_reports/workflow_provenance.json

      - name: Explain persistent stop
        if: steps.gate.outputs.stopped == 'true'
        run: echo 'STOPPED after the saved session loss. No reset, no scanning, and no successor dispatch. Cron remains enabled.'

      - name: Install Python
        if: steps.gate.outputs.stopped != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.stopped != 'true'
        run: python -m pip install -r requirements.txt

      - name: Compile and test the code that will run
        if: steps.gate.outputs.stopped != 'true'
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m pytest -q | tee runtime_reports/pytest.txt

      - name: Exercise all six deterministic scenarios
        if: steps.gate.outputs.stopped != 'true'
        run: |
          set -euo pipefail
          python simulate.py --scenario all | tee runtime_reports/simulation.txt

      - name: Verify the read-only trading boundary
        if: steps.gate.outputs.stopped != 'true'
        run: python scripts/audit_paper_boundary.py

      - name: Validate all thirty mappings with current Kalshi data
        if: steps.gate.outputs.stopped != 'true'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PAPER_SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
          PAPER_CODE_FINGERPRINT: ${{ steps.gate.outputs.code_fingerprint }}
        run: |
          set -euo pipefail
          python validate_universe.py --output universe_report.csv --json-output universe_report.json --wait 10
          cat universe_report.csv

      # Dispatch only after validation succeeds. A failing test cannot recursively
      # dispatch another failing test run; the five-minute cron remains recovery.
      - name: Queue the next serialized run
        if: success() && steps.gate.outputs.stopped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run main.yml --ref main

      - name: Run ten-minute persistent simulated paper trading
        if: steps.gate.outputs.stopped != 'true'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PAPER_SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
          PAPER_CODE_FINGERPRINT: ${{ steps.gate.outputs.code_fingerprint }}
        run: >-
          python -u paper_runner.py --duration 600 --interval 2
          --paper --persist-to-github --state paper_state.json
          --report-dir runtime_reports

      - name: Record final persistent state
        if: success() && steps.gate.outputs.stopped != 'true'
        run: python3 scripts/workflow_gate.py --state paper_state.json

      - name: Preserve validation and monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime_reports/
            universe_report.csv
            universe_report.json
          if-no-files-found: warn
          retention-days: 14
