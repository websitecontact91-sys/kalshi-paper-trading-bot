
name: Kalshi Bot - Consolidated Paper Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Download bot code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test all trading rules
        run: python -m pytest -q

      - name: Run consolidated paper monitor
        run: python -u paper_runner.py --duration 15
