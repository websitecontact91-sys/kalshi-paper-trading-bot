
name: Kalshi 15-minute paper trading

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-paper-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download bot code and saved paper state
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install cryptography

      - name: Run persistent simulated paper trading
        env:
          GITHUB_ACTIONS: 'true'
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python -u paper_runner.py --duration 300 --paper --persist-to-github
