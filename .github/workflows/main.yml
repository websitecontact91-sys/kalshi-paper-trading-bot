
name: Kalshi Bot - Continuous Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Download bot code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Test trading rules
        run: python -m pytest -q

      - name: Check Kalshi market discovery
        run: python -u discover.py

      - name: Run continuous monitoring
        run: |
          python -u monitor.py --interval 2 &
          MONITOR_PID=$!
          sleep 300
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
