
name: Kalshi Bot - Consolidated Paper Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Download bot code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install cryptography

      - name: Test all trading rules
        run: python -m pytest -q --ignore=test_kalshi_prices.py

      - name: Test Kalshi live Bitcoin price
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python -u test_kalshi_prices.py
