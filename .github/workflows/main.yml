
name: Kalshi 15-minute paper trading

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-paper-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Download bot code and saved paper state
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install cryptography

      - name: Check Python syntax
        run: python -m py_compile paper_runner.py discover.py bot.py feed_probe.py market_coverage.py reference_windows.py pyth_prices.py

      - name: Test paper trading decisions
        run: python -m pytest -q test_paper_decisions.py test_market_coverage.py test_reference_windows.py test_pyth_prices.py

      - name: Audit live crypto market rules
        run: python -u audit_market_rules.py

      - name: Diagnose all 15-minute market price feeds
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          PYTH_VERIFIED_FEED_IDS: ${{ vars.PYTH_VERIFIED_FEED_IDS }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python -u feed_probe.py

      - name: Run persistent simulated paper trading
        env:
          GITHUB_ACTIONS: 'true'
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python -u paper_runner.py --duration 240 --paper --persist-to-github
